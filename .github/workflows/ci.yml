name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Run test suite
        run: pytest -q
      - name: Query CLI self-test (stdlib only)
        run: python query.py --selftest
      - name: Validate dataset against schemas
        run: python scripts/validate.py

  package:
    name: pip install sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import smoke test
        run: python -c "import osint_analytics, query, livesearch; print('imports OK')"
